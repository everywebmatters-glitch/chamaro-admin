# Substitutions: _IMAGE (required) and _API_URL (defaults to the production API; it is public, not a secret).
substitutions:
  _API_URL: https://api.chamaro.com/api/v1

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_API_URL}'
      - '.'
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
